function openDb(){return new Promise(function(ok,fail){var r=indexedDB.open("nikole-storybook-v1",1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("pages"))r.result.createObjectStore("pages",{keyPath:"key"})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){fail(r.error)}})}
function loadAll(){return new Promise(function(ok,fail){if(!db)return ok([]);var r=db.transaction("pages","readonly").objectStore("pages").getAll();r.onsuccess=function(){ok(r.result||[])};r.onerror=function(){fail(r.error)}})}
function saveBook(sid,blobs){return new Promise(function(ok,fail){var tr=db.transaction("pages","readwrite"),st=tr.objectStore("pages");for(var i=0;i<10;i++)st.delete(sid+":"+i);blobs.forEach(function(blob,i){st.put({key:sid+":"+i,blob:blob,size:blob.size})});tr.oncomplete=ok;tr.onerror=function(){fail(tr.error)}})}
function deleteBook(sid){return saveBook(sid,[])}
function unloadImages(){urls.forEach(function(x){URL.revokeObjectURL(x)});urls=[];images={}}
async function loadBook(sid){unloadImages();var records=await loadAll();records.forEach(function(r){if(r.key.indexOf(sid+":")===0 && r.blob){var num=Number(r.key.split(":")[1]);if(num>=0&&num<=9){var u=URL.createObjectURL(r.blob);images[num]=u;urls.push(u)}}})}
function getCount(sid,recs){return recs.filter(function(r){return r.key.indexOf(sid+":")===0}).length}
async function refreshBonus(){
var recs=await loadAll();
coverObjectUrls.forEach(function(url){URL.revokeObjectURL(url)});
coverObjectUrls=[];importedCovers={};unlockedBonus={};installedCounts={};
STORIES.forEach(function(book){installedCounts[book.id]=getCount(book.id,recs)});
STORIES.forEach(function(book){
var allPages=recs.filter(function(r){return r.key.indexOf(book.id+":")===0&&r.blob});
if(book.bonus)unlockedBonus[book.id]=allPages.length===10;
if(allPages.length===10){
var first=allPages.find(function(r){return r.key===book.id+":0"});
if(first){var cover=URL.createObjectURL(first.blob);coverObjectUrls.push(cover);importedCovers[book.id]=cover}
}
})
}

function photoWriteAll(blobs){return new Promise(function(ok,fail){var tx=db.transaction("pages","readwrite"),store=tx.objectStore("pages");store.delete("personal:nicole");for(var i=0;i<5;i++)store.delete("personal:nicole:"+i);blobs.forEach(function(blob,i){store.put({key:"personal:nicole:"+i,blob:blob,size:blob.size})});tx.oncomplete=ok;tx.onerror=function(){fail(tx.error)}})}

async function photoReload(){
privatePhotos.forEach(function(u){URL.revokeObjectURL(u)});privatePhotos=[];
try{
var records=await photoGetAll(),modern=records.filter(function(r){return /^personal:nicole:[0-4]$/.test(r.key)}).sort(function(a,b){return Number(a.key.split(":").pop())-Number(b.key.split(":").pop())});

modern.forEach(function(r){if(r.blob)privatePhotos.push(URL.createObjectURL(r.blob))});
photoIsSet=privatePhotos.length>0;

/* ZIP importer: ZIP64/encrypted archives are rejected. Files are decoded on-device. */
async function unzipPictures(file){
if(file.size>125829120)throw new Error("Архив слишком большой. Максимум 120 МБ.");
var bytes=new Uint8Array(await file.arrayBuffer()),dv=new DataView(bytes.buffer),eocd=-1;
for(var p=bytes.length-22;p>=Math.max(0,bytes.length-65557);p--){if(dv.getUint32(p,true)===0x06054b50){eocd=p;break}}
if(eocd<0)throw new Error("ZIP не распознан. Используй обычный ZIP-архив.");
var count=dv.getUint16(eocd+10,true),pos=dv.getUint32(eocd+16,true);
if(count>200||pos>=eocd)throw new Error("Слишком много файлов в архиве.");
var entries=[],sum=0,decoder=new TextDecoder("utf-8");
for(var k=0;k<count;k++){
if(pos+46>bytes.length||dv.getUint32(pos,true)!==0x02014b50)throw new Error("Ошибка структуры ZIP.");
var method=dv.getUint16(pos+10,true),flags=dv.getUint16(pos+8,true),packed=dv.getUint32(pos+20,true),size=dv.getUint32(pos+24,true),fnlen=dv.getUint16(pos+28,true),elen=dv.getUint16(pos+30,true),clen=dv.getUint16(pos+32,true),offset=dv.getUint32(pos+42,true);
if(pos+46+fnlen+elen+clen>bytes.length)throw new Error("Неполный ZIP.");
var name=decoder.decode(bytes.subarray(pos+46,pos+46+fnlen)),base=name.split("/").pop();
pos+=46+fnlen+elen+clen;
if(!base||name.includes("__MACOSX/")||base.startsWith(".")||!/\.(jpe?g|png|webp)$/i.test(base)||/(?:обложк|cover|коллаж|contact|обзор)/i.test(base))continue;
if(flags&1)throw new Error("ZIP с паролем не поддерживается.");
if((method!==0&&method!==8)||packed===0||size===0||packed>35000000||size>35000000)throw new Error("Один из файлов ZIP имеет неподдерживаемый размер или формат.");
sum+=size;if(sum>160000000)throw new Error("Слишком много данных в ZIP.");
entries.push({name:base,packed:packed,size:size,offset:offset,method:method});
}
entries.sort(function(a,b){return a.name.localeCompare(b.name,"ru",{numeric:true,sensitivity:"base"})});
if(entries.length!==10)throw new Error("В архиве найдено "+entries.length+" страниц. Для одной книжки нужно ровно 10 изображений.");
var files=[];
for(var entry of entries){
var o=entry.offset;
if(o+30>bytes.length||dv.getUint32(o,true)!==0x04034b50)throw new Error("ZIP повреждён.");
var locName=dv.getUint16(o+26,true),locExtra=dv.getUint16(o+28,true),start=o+30+locName+locExtra;
if(start+entry.packed>bytes.length)throw new Error("ZIP повреждён.");
var zipped=bytes.subarray(start,start+entry.packed),plain;
if(entry.method===0)plain=zipped;
else{
if(typeof DecompressionStream==="undefined")throw new Error("Для распаковки ZIP обнови Safari.");
try{
var stream=new Blob([zipped]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
plain=new Uint8Array(await new Response(stream).arrayBuffer())
}catch(error){throw new Error("Не удалось распаковать ZIP. Используй выбор 10 картинок.")}
}
if(plain.length!==entry.size)throw new Error("Повреждённая страница ZIP: "+entry.name);
var mime=/\.png$/i.test(entry.name)?"image/png":/\.webp$/i.test(entry.name)?"image/webp":"image/jpeg";
files.push(new File([plain],entry.name,{type:mime}));
}
return files;
}

async function readNicoleLibraryBundle(file){
if(file.size>83886080)throw Error("Архив превышает 80 МБ.");
var bytes=new Uint8Array(await file.arrayBuffer()),v=new DataView(bytes.buffer),end=-1;
for(var p=bytes.length-22;p>=Math.max(0,bytes.length-65557);p--){if(v.getUint32(p,true)===0x06054b50){end=p;break}}
if(end<0)throw Error("Не удалось распознать ZIP.");
var cnt=v.getUint16(end+10,true),pos=v.getUint32(end+16,true),decoder=new TextDecoder("utf-8");
if(cnt<60||cnt>100||pos>=end)throw Error("Неверный формат архива с шестью сказками.");
var ids=["dino","balloons","seed","thumbelina","father","seva"],books={},photos=[];
ids.forEach(function(id){books[id]=Array(10).fill(null)});
for(var i=0;i<cnt;i++){
if(pos+46>bytes.length||v.getUint32(pos,true)!==0x02014b50)throw Error("Повреждена структура ZIP.");
var flags=v.getUint16(pos+8,true),method=v.getUint16(pos+10,true),packed=v.getUint32(pos+20,true),size=v.getUint32(pos+24,true),n=v.getUint16(pos+28,true),e=v.getUint16(pos+30,true),c=v.getUint16(pos+32,true),loc=v.getUint32(pos+42,true);
if(pos+46+n+e+c>bytes.length)throw Error("ZIP обрезан.");
var name=decoder.decode(bytes.subarray(pos+46,pos+46+n));pos+=46+n+e+c;
var page=name.match(/^(dino|balloons|seed|thumbelina|father|seva)\/(0[1-9]|10)\.webp$/),portrait=name.match(/^portraits\/(0[1-5])\.webp$/);
if(!page&&!portrait)continue;
if(flags&1||method!==0||packed!==size||size<100||size>6000000)throw Error("Неподдерживаемая страница: "+name);
if(loc+30>bytes.length||v.getUint32(loc,true)!==0x04034b50)throw Error("Некорректная страница: "+name);
var ln=v.getUint16(loc+26,true),le=v.getUint16(loc+28,true),start=loc+30+ln+le;
if(start+size>bytes.length)throw Error("Неполная страница: "+name);
var blob=new Blob([bytes.subarray(start,start+size)],{type:"image/webp"});
if(page){
var ix=Number(page[2])-1;if(books[page[1]][ix])throw Error("Повтор страницы: "+name);
books[page[1]][ix]=blob;
}else{
var pi=Number(portrait[1])-1;if(photos[pi])throw Error("Повтор фотографии: "+name);
photos[pi]=blob;
}
}
for(var id of ids){if(books[id].some(function(x){return !x}))throw Error("В архиве не хватает страниц сказки "+id)}
return {books:books,ids:ids,photos:photos.filter(Boolean)};
}

function compress(file){return new Promise(function(ok,fail){var blobURL=URL.createObjectURL(file),img=new Image();img.onload=function(){try{var f=Math.min(1,1400/Math.max(img.width,img.height));var canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*f));canvas.height=Math.max(1,Math.round(img.height*f));var ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(function(blob){URL.revokeObjectURL(blobURL);if(blob)ok(blob);else fail(new Error("Не удалось сохранить изображение"))},"image/webp",.82)}catch(err){URL.revokeObjectURL(blobURL);fail(err)}};img.onerror=function(){URL.revokeObjectURL(blobURL);fail(new Error("Формат не поддерживается"))};img.src=blobURL})}
