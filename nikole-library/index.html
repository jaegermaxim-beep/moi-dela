{id:"dog",name:"Собачка Аф",short:"Аф",emoji:"🐶",card:"#f6dfcf",badge:"Добрый щенок",text:["Это собачка Аф!","Аф проснулся и потянулся.","За окном светило солнышко.","Аф нашёл любимый мячик.","Мячик покатился по дорожке.","Аф побежал: топ-топ-топ!","У дерева он встретил котёнка.","Они поиграли вместе.","Потом Аф попил водички.","И свернулся клубочком спать."]},

function openDb(){return new Promise(function(ok,fail){var r=indexedDB.open("nikole-storybook-v1",1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("pages"))r.result.createObjectStore("pages",{keyPath:"key"})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){fail(r.error)}})}
function loadAll(){return new Promise(function(ok,fail){if(!db)return ok([]);var r=db.transaction("pages","readonly").objectStore("pages").getAll();r.onsuccess=function(){ok(r.result||[])};r.onerror=function(){fail(r.error)}})}
function saveBook(sid,blobs){return new Promise(function(ok,fail){var tr=db.transaction("pages","readwrite"),st=tr.objectStore("pages");for(var i=0;i<10;i++)st.delete(sid+":"+i);blobs.forEach(function(blob,i){st.put({key:sid+":"+i,blob:blob,size:blob.size})});tr.oncomplete=ok;tr.onerror=function(){fail(tr.error)}})}
function deleteBook(sid){return saveBook(sid,[])}
function unloadImages(){urls.forEach(function(x){URL.revokeObjectURL(x)});urls=[];images={}}
async function loadBook(sid){unloadImages();var records=await loadAll();records.forEach(function(r){if(r.key.indexOf(sid+":")===0 && r.blob){var num=Number(r.key.split(":")[1]);if(num>=0&&num<=9){var u=URL.createObjectURL(r.blob);images[num]=u;urls.push(u)}}})}
function getCount(sid,recs){return recs.filter(function(r){return r.key.indexOf(sid+":")===0}).length}
function bookButton(s,big){return '<button class="book'+(big?' big':'')+'" style="--card:'+s.card+'" data-book="'+s.id+'" aria-label="Открыть сказку '+s.name+'"><span class="book-text">'+(big?'<span class="mini-stars">✦ ✧ ✦</span>':'')+'<span class="name">'+s.name+'</span><span class="sub">'+(big?'Нажми, чтобы читать':'Сказка для тебя')+'</span></span><span class="art">'+svg(s.id)+'</span>'+(favorites[s.id]?'<span class="bookmark-heart">♥</span>':'')+'</button>'}
function drawHome(){root.innerHTML='<main class="home"><header class="head"><div class="brand"><span class="brand-mark">🌸</span>МИР НИКОЛЬ</div><button class="parent-access" aria-label="Родительские настройки, удерживайте две секунды" title="Родителям: удерживать 2 секунды" data-parent="1">⚙</button></header><section class="intro"><span class="eyebrow">Для нашей маленькой Николь ♡</span><h1>Выбирай сказку!</h1><p>Нажми на любимого зверька 🧸</p></section><div class="section-heading"><h2>Любимые зверята</h2><small>Одно касание</small></div><div class="books">'+STORIES.slice(0,3).map(function(s,i){return bookButton(s,i===0)}).join("")+'</div><div class="section-heading more-heading"><h2>Ещё истории</h2><small>Листай ниже ↓</small></div><div class="books">'+STORIES.slice(3).map(function(s){return bookButton(s,false)}).join("")+'</div><div class="footer-note">С любовью для Николь ✨</div></main>';attachParentHold()}
function drawReader(){var s=story(id);if(!s){goHome();return}var art=images[page]?'<img alt="Иллюстрация страницы '+(page+1)+'" src="'+images[page]+'">':'<div class="main-animal">'+svg(id)+'</div>';
root.innerHTML='<main class="reader'+(sleep?' sleep':'')+'"><header class="reader-head"><button class="round" data-home="1" aria-label="Все сказки">⌂</button><strong class="story-name">'+s.name+'</strong><button class="round sleep-toggle" data-sleep="1" aria-label="'+(sleep?'Выключить':'Включить')+' спокойный режим">'+(sleep?'☀':'☾')+'</button></header><div class="progress">'+s.text.map(function(t,i){return '<span class="'+(i===page?'active':'')+'"></span>'}).join("")+'</div><section class="story-stage" style="--card:'+s.card+'" id="storyStage">'+art+'<button class="tap left" data-turn="-1" aria-label="Предыдущая страница"></button><button class="tap right" data-turn="1" aria-label="Следующая страница"></button><span class="decor">Листай пальчиком ✦</span></section><section class="story-copy"><p class="count">'+(page+1)+' из 10</p><h1 class="story-line">'+s.text[page]+'</h1></section><div class="story-controls"><button data-turn="-1" '+(page===0?'disabled':'')+'>← Назад</button><button class="next" data-turn="1">'+(page===9?'Сначала ↻':'Дальше →')+'</button></div></main>';
var stage=document.getElementById("storyStage"),x0=null,y0=null,moved=false;
stage.addEventListener("touchstart",function(e){x0=e.changedTouches[0].clientX;y0=e.changedTouches[0].clientY;moved=false},{passive:true});
stage.addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.25){moved=true;lastSwipeAt=Date.now();turn(dx<0?1:-1)}x0=null},{passive:true});
stage.addEventListener("click",function(e){if(moved){moved=false;e.preventDefault();e.stopPropagation()}},true);
}
async function drawParents(){var recs=await loadAll(),amount=recs.reduce(function(a,x){return a+(x.size||0)},0);
root.innerHTML='<main class="parents"><button class="back" data-home="1">← К сказкам</button><h1>Для родителей</h1><p class="explain">Добавляйте собственные иллюстрации. Они сохраняются на этом устройстве и не загружаются в публичный GitHub.</p><section class="parent-card"><h2>Картинки для сказок</h2><p>Выбери 10 изображений одной сказки в правильном порядке. Лучше заранее назвать их 01–10. Повторный импорт заменит картинки только выбранной книги.</p>'+STORIES.map(function(s){return '<div class="parent-book" style="--card:'+s.card+'"><span class="tiny">'+s.emoji+'</span><span class="info"><strong>'+s.name+'</strong><small>'+getCount(s.id,recs)+' из 10 картинок</small></span><button class="action" data-import="'+s.id+'">Добавить</button></div>'}).join("")+'</section><section class="parent-card"><h2>Хранилище</h2><p>На этом iPhone картинки занимают примерно '+(amount/1048576).toFixed(1)+' МБ. Оригиналы нужно сохранить в Dropbox, потому что iOS может очистить данные приложения.</p><p>Интеграция с закрытым Dropbox пока не настроена. Настройки здесь предназначены только для взрослого.</p></section><section class="parent-card"><h2>Удаление картинок</h2><p>Можно очистить картинки конкретной сказки, не затрагивая оригиналы в Dropbox.</p><button class="action danger" data-clear-list="1">Выбрать сказку для очистки</button><div id="clearPanel"></div></section></main>';}
function turn(delta){if(screen!=="reader")return;page=(page+delta+10)%10;drawReader()}
function goHome(){screen="home";id=null;sleep=false;unloadImages();drawHome();window.scrollTo(0,0)}
async function openBook(sid){if(!story(sid))return;screen="reader";id=sid;page=0;sleep=false;await loadBook(sid);drawReader();window.scrollTo(0,0)}
function attachParentHold(){var b=root.querySelector("[data-parent]");if(!b)return;function cancel(){clearTimeout(parentTimer);parentTimer=null;holdButton=null}
b.addEventListener("pointerdown",function(e){if(e.button!==undefined&&e.button!==0)return;cancel();holdButton=b;holdCompleted=false;parentTimer=setTimeout(function(){parentTimer=null;holdCompleted=true;screen="parents";drawParents();if(navigator.vibrate)navigator.vibrate(35)},1800)});
["pointerup","pointercancel","pointerleave"].forEach(function(n){b.addEventListener(n,cancel)});
b.addEventListener("contextmenu",function(e){e.preventDefault()});b.addEventListener("click",function(e){e.preventDefault();if(!holdCompleted)say("Удерживайте ⚙ 2 секунды")});}
function compress(file){return new Promise(function(ok,fail){var blobURL=URL.createObjectURL(file),img=new Image();img.onload=function(){try{var f=Math.min(1,1400/Math.max(img.width,img.height));var canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*f));canvas.height=Math.max(1,Math.round(img.height*f));var ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(function(blob){URL.revokeObjectURL(blobURL);if(blob)ok(blob);else fail(new Error("Не удалось сохранить изображение"))},"image/webp",.82)}catch(err){URL.revokeObjectURL(blobURL);fail(err)}};img.onerror=function(){URL.revokeObjectURL(blobURL);fail(new Error("Формат не поддерживается"))};img.src=blobURL})}
document.getElementById("fileInput").addEventListener("change",async function(e){var selected=Array.from(e.target.files||[]).filter(function(x){return x.type.startsWith("image/")}).sort(function(a,b){return a.name.localeCompare(b.name,"ru",{numeric:true})});e.target.value="";if(!selected.length)return;if(selected.length>10){say("Для одной сказки выбери не больше 10 изображений");return}if(!db){say("Не удалось открыть локальное хранилище");return}say("Подготавливаю картинки…");var result=[];try{for(var k=0;k<selected.length;k++)result.push(await compress(selected[k]));await saveBook(importId,result);say("Сохранено "+result.length+" картинок");await drawParents()}catch(err){console.error(err);say("Ошибка импорта. Проверь формат картинок и свободное место.")}});
root.addEventListener("click",async function(e){var el=e.target.closest("button");if(!el)return;var d=el.dataset;
if(d.book){await openBook(d.book)}
else if(d.home){goHome()}
else if(d.turn){if(Date.now()-lastSwipeAt>=550)turn(Number(d.turn))}
else if(d.sleep){sleep=!sleep;drawReader()}
else if(d.import){if(!db){say("Хранилище недоступно");return}var existing=getCount(d.import,await loadAll());if(existing && !confirm("Заменить "+existing+" ранее загруженных картинок в книге? Оригиналы в Dropbox останутся."))return;importId=d.import;document.getElementById("fileInput").click()}
else if(d.clearList){var panel=document.getElementById("clearPanel");panel.innerHTML=STORIES.map(function(s){return '<button class="action secondary" style="margin:6px 6px 0 0" data-clear="'+s.id+'">'+s.name+'</button>'}).join("")}
else if(d.clear){if(confirm("Удалить только загруженные изображения сказки «"+story(d.clear).name+"» с этого iPhone?")){await deleteBook(d.clear);await drawParents();say("Картинки удалены только с iPhone")}}
});
window.addEventListener("keydown",function(e){if(screen==="reader"&&e.key==="ArrowRight")turn(1);if(screen==="reader"&&e.key==="ArrowLeft")turn(-1);if(screen==="reader"&&e.key==="Escape")goHome()});
async function init(){try{db=await openDb()}catch(err){console.warn("IndexedDB is unavailable",err);say("Нет доступа к сохранению картинок")}drawHome();if("serviceWorker" in navigator && location.protocol.indexOf("http")===0)navigator.serviceWorker.register("./sw.js").catch(function(err){console.warn(err)})}
init();
})();
</script></body></html>
