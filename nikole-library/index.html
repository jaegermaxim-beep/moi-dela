margin:0}.section-title span{font-size:12px;color:var(--muted)}.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 13px}.book{border:0;padding:0;background:none;text-align:left;min-width:0}.cover{border-radius:23px;aspect-ratio:.84;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);background:var(--bg)}.cover:after{content:"";position:absolute;width:170px;height:170px;right:-70px;bottom:-100px;background:rgba(255,255,255,.28);border-radius:50%}.cover .animal{font-size:clamp(78px,21vw,118px);transform:translateY(-2px);filter:drop-shadow(0 12px 8px rgba(70,55,55,.13));user-select:none}.cover .spot{position:absolute;left:13px;top:13px;background:rgba(255,255,255,.72);font-size:10px;line-height:1;padding:8px 10px;border-radius:40px;font-weight:750}.cover .heart{position:absolute;right:13px;top:13px;z-index:2;color:#a76498;font-size:18px}.book-title{display:block;font-size:15px;font-weight:850;letter-spacing:-.025em;margin:9px 2px 3px}.book-caption{display:block;color:var(--muted);font-size:11px;margin-left:2px}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(255,255,255,.96);border-top:1px solid #eee7ea;padding:10px 8px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(20px)}.nav-inner{display:flex;width:min(100%,650px);justify-content:space-around}.nav button{border:0;background:none;color:#918896;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:82px;font-size:10px;font-weight:800}.nav button .ico{font-size:22px}.nav button.selected{color:#935caf}.reader{min-height:calc(100dvh - 95px);display:flex;flex-direction:column}.reader-head{display:flex;align-items:center;justify-content:space-between;padding-top:9px;gap:8px}.reader-head strong{font-size:16px;text-align:center;max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reader-photo{flex:1;min-height:350px;margin:17px 0 14px;position:relative;border-radius:27px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}.reader-photo img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.reader-emoji{font-size:clamp(140px,46vw,260px);text-shadow:0 16px 10px #00000011}.page-tag{position:absolute;top:16px;left:16px;border-radius:30px;padding:8px 12px;background:#ffffffba;font-size:12px;font-weight:800}.reader-body{text-align:center;padding:0 12px 10px}.reader-body h2{font-size:22px;line-height:1.36;font-weight:850;min-height:62px;margin:9px 0}.reader-body .soft{font-size:12px;color:var(--muted)}.page-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px}.page-controls button{border:0;border-radius:18px;background:#fff;min-height:54px;min-width:62px;box-shadow:0 5px 16px #56445a11;font-size:22px}.page-controls button:disabled{opacity:.3}.dots{display:flex;gap:5px;align-items:center}.dots b{height:6px;width:6px;background:#ded5df;border-radius:10px}.dots b.on{width:17px;background:#9d64c0}.setup{border-radius:19px;padding:15px 16px;margin-top:10px;background:#fff;border:1px solid var(--border)}.setup p{color:var(--muted);font-size:12px;line-height:1.6;margin:7px 0}.btn{border:0;padding:13px 15px;border-radius:14px;background:#a774c2;color:#fff;font-size:13px;font-weight:800}.btn.secondary{background:#f2e7f8;color:#8555a1}.btn.danger{background:#fff1ef;color:#a9475c}.btn:disabled{opacity:.55}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:11px 0}.notice{font-size:12px;color:var(--muted);line-height:1.55}.empty{background:#fff;padding:32px 24px;border-radius:22px;text-align:center;color:var(--muted);font-size:14px}.empty .emoji{font-size:50px;margin-bottom:10px}.setting-title{font-size:17px;font-weight:800;margin:5px 0}.progress{height:5px;background:#efe4f3;border-radius:10px;overflow:hidden}.progress div{background:#a774c2;height:100%;transition:width .2s}.smallcode{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 17px;border-radius:14px;color:#fff;background:#514159;box-shadow:0 6px 30px #34283a44;font-size:13px;font-weight:700;max-width:90vw;text-align:center;z-index:40;display:none}.toast.show{display:block}#fileInput{display:none}@media(min-width:560px){.library{grid-template-columns:repeat(3,minmax(0,1fr))}.cover .animal{font-size:100px}}@media(prefers-reduced-motion:no-preference){button{transition:transform .15s ease}button:active{transform:scale(.97)}}
.rabbit-art{display:block;width:100%;height:100%;filter:drop-shadow(0 8px 7px rgba(50,50,50,.10))}.cover .animal:has(.rabbit-art){width:87%;height:95%;display:flex;align-items:center;justify-content:center;transform:none;filter:none}.reader-emoji:has(.rabbit-art){width:min(90%,350px);height:86%;max-height:490px;display:flex;align-items:center;justify-content:center;text-shadow:none}</style>

{id:"rabbit",title:"Зайчик Ась",emoji:"🐰",bg:"linear-gradient(145deg,#d7e9e3,#f6edd4)",t:["Жил-был маленький зайчик.","Утром он выглянул из домика.","На траве блестела росинка.","Зайчик нашёл мягкий листочек.","Вдруг прилетела бабочка.","Зайчик помахал ей лапкой.","В лесу зашуршали деревья.","Мама-зайчиха позвала домой.","Зайчик обнял маму.","И сладко-сладко уснул."]},

{id:"cleo",title:"Кошечка Клео",emoji:"🐱",bg:"linear-gradient(145deg,#f4d6c0,#fbeec7)",t:["Это наша рыжая кошечка Клео.","Клео открыла глазки: мяу!","Она мягко потянулась.","Клео ищет свою Николь.","А вот и мячик!","Клео осторожно тронула его лапкой.","Мячик укатился под диван.","Клео нашла его. Ура!","Николь ласково зовёт: Клео!","Клео мурлычет и отдыхает."]},

{id:"chick",title:"Цыплёнок Пипи",emoji:"🐥",bg:"linear-gradient(145deg,#f8e6a6,#ffeccc)",t:["Маленький цыплёнок Пипи проснулся.","Пипи сказал: пи-пи-пи!","Мама-курочка улыбнулась.","Пипи вышел на тёплый двор.","Он увидел крошечный цветочек.","Возле цветка сидела божья коровка.","Пипи поздоровался с ней.","Потом он нашёл зёрнышко.","Мама позвала Пипи к себе.","Пипи прижался к маме и уснул."]},
{id:"mouse",title:"Мышиная история Пипи",emoji:"🐭",bg:"linear-gradient(145deg,#ddd8f5,#f4dbe6)",t:["Жила-была маленькая мышка Пипи.","Она выглянула из норки.","Вокруг было тихо-тихо.","Пипи нашла круглое зёрнышко.","Она понесла его домой.","По дороге встретилась улитка.","Пипи сказала: привет!","Вместе они посмотрели на звёздочку.","Мышка спряталась в уютную норку.","И увидела самый сладкий сон."]}
];
var database=null,screen="home",activeStory=null,page=0,faves={};var photoUrls=[],photoMap={};var importStory=null;var touchX=0;var root=document.getElementById("root"),toastEl=document.getElementById("toast");var toastTimer;
function message(s){toastEl.textContent=s;toastEl.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove("show")},3500)}
function openDb(){return new Promise(function(resolve,reject){var r=indexedDB.open("nikole-storybook-v1",1);r.onupgradeneeded=function(){r.result.createObjectStore("pages",{keyPath:"key"})};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}
function allPages(){return new Promise(function(resolve,reject){if(!database)return resolve([]);var r=database.transaction("pages","readonly").objectStore("pages").getAll();r.onsuccess=function(){resolve(r.result||[])};r.onerror=function(){reject(r.error)}})}
function saveImage(key,blob){return new Promise(function(resolve,reject){var tr=database.transaction("pages","readwrite");tr.objectStore("pages").put({key:key,blob:blob,size:blob.size});tr.oncomplete=resolve;tr.onerror=function(){reject(tr.error)}})}
function clearBook(id){return allPages().then(function(list){return new Promise(function(resolve,reject){var tr=database.transaction("pages","readwrite"),store=tr.objectStore("pages");list.forEach(function(p){if(p.key.indexOf(id+":")===0)store.delete(p.key)});tr.oncomplete=resolve;tr.onerror=function(){reject(tr.error)}})})}
function cleanup(){photoUrls.forEach(function(url){URL.revokeObjectURL(url)});photoUrls=[];photoMap={}}
async function hydrate(){cleanup();var list=await allPages();list.forEach(function(p){if(p.key.indexOf(activeStory+":")===0){var n=Number(p.key.split(":")[1]);if(n>=0&&n<10){var url=URL.createObjectURL(p.blob);photoUrls.push(url);photoMap[n]=url}}})}
function countPics(id,list){return list.filter(function(p){return p.key.indexOf(id+":")===0}).length}
function saveFaves(){try{localStorage.setItem("nikole-storybook-favorites",JSON.stringify(faves))}catch(e){}}
function navBar(){return '<nav class="nav"><div class="nav-inner"><button data-nav="home" class="'+(screen==="home"?"selected":"")+'"><span class="ico">▦</span>Библиотека</button><button data-nav="favorites" class="'+(screen==="favorites"?"selected":"")+'"><span class="ico">♡</span>Любимые</button><button data-nav="settings" class="'+(screen==="settings"?"selected":"")+'"><span class="ico">⚙</span>Настройки</button></div></nav>'}
function rabbitArtwork(){return '<svg class="rabbit-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" role="img" aria-label="Зайчик Ась целиком с длинными ушами"><ellipse cx="130" cy="325" rx="83" ry="10" fill="#afbaa9" opacity=".22"/><circle cx="195" cy="242" r="22" fill="#fff9ef"/><path d="M85 141C68 101 50 15 75 8c29-8 44 83 48 137Z" fill="#fff9ef" stroke="#ddcfc3" stroke-width="2"/><path d="M90 121C76 83 67 28 79 26c13-2 26 66 27 98Z" fill="#f6bec7"/><path d="M142 144c6-59 24-137 52-135 31 3 3 99-30 139Z" fill="#fff9ef" stroke="#ddcfc3" stroke-width="2"/><path d="M159 125c11-57 25-96 35-93 11 3-3 62-27 96Z" fill="#f6bec7"/><ellipse cx="129" cy="246" rx="73" ry="74" fill="#fff9ef" stroke="#e9ddd0" stroke-width="2"/><ellipse cx="130" cy="268" rx="42" ry="46" fill="#fff"/><ellipse cx="76" cy="247" rx="16" ry="34" transform="rotate(17 76 247)" fill="#fff9ef"/><ellipse cx="183" cy="247" rx="16" ry="34" transform="rotate(-17 183 247)" fill="#fff9ef"/><ellipse cx="87" cy="311" rx="34" ry="16" transform="rotate(-8 87 311)" fill="#fff9ef" stroke="#e9ddd0" stroke-width="2"/><ellipse cx="174" cy="311" rx="34" ry="16" transform="rotate(8 174 311)" fill="#fff9ef" stroke="#e9ddd0" stroke-width="2"/><ellipse cx="130" cy="164" rx="65" ry="65" fill="#fff9ef" stroke="#e9ddd0" stroke-width="2"/><ellipse cx="102" cy="174" rx="16" ry="10" fill="#f5c6c9" opacity=".55"/><ellipse cx="158" cy="174" rx="16" ry="10" fill="#f5c6c9" opacity=".55"/><ellipse cx="108" cy="158" rx="5.5" ry="7.5" fill="#594952"/><ellipse cx="152" cy="158" rx="5.5" ry="7.5" fill="#594952"/><circle cx="110" cy="155" r="1.5" fill="#fff"/><circle cx="154" cy="155" r="1.5" fill="#fff"/><path d="M123 179q7-7 14 0-7 10-14 0Z" fill="#e0a4ae"/><path d="M130 186v6m0 0q-8 9-16-1m16 1q8 9 16-1" fill="none" stroke="#927a73" stroke-width="2.5" stroke-linecap="round"/><path d="M74 194H55m18 9H58m127-9h19m-18 9h15" stroke="#c4b7af" stroke-width="2.2" stroke-linecap="round"/></svg>';}
function bookCard(s,pics){return '<button class="book" data-book="'+s.id+'"><div class="cover" style="--bg:'+s.bg+'"><span class="spot">'+pics+'/10 картинок</span><span class="animal">'+(s.id==="rabbit"?rabbitArtwork():s.emoji)+'</span>'+(faves[s.id]?'<span class="heart">♥</span>':'')+'</div><span class="book-title">'+s.title+'</span><span class="book-caption">10 страниц · '+(pics===10?"Готова к чтению":"История с текстом")+'</span></button>'}
async function render(){if(screen==="reader"){renderReader();return}var list=await allPages();var header='<header class="top"><div class="logo"><span class="moon">🌙</span><span>МИР НИКОЛЬ<br><span class="small">Маленькие истории</span></span></div><button class="round" data-nav="settings" aria-label="Настройки">⚙</button></header>';
if(screen==="home"){root.innerHTML=header+'<div class="hero"><span class="cloud" aria-hidden="true">☁️</span><span class="pill">✦ Истории на каждый день</span><h1>Сказки для<br>Николь</h1><p>Листаем, читаем, улыбаемся. Все любимые герои рядом.</p></div><div class="section-title"><h2>Наши книжки</h2><span>6 историй · 60 страниц</span></div><div class="library">'+stories.map(function(s){return bookCard(s,countPics(s.id,list))}).join("")+'</div>'+navBar();return}
if(screen==="favorites"){var selected=stories.filter(function(s){return faves[s.id]});root.innerHTML=header+'<h1>Любимые сказки ♡</h1><p class="subtitle">Книжки, которые всегда хочется перечитать.</p>'+(selected.length?'<div class="library">'+selected.map(function(s){return bookCard(s,countPics(s.id,list))}).join("")+'</div>':'<div class="empty"><div class="emoji">💜</div>Открой сказку и нажми на сердечко.<br>Она появится здесь.</div>')+navBar();return}
if(screen==="settings"){var total=list.reduce(function(a,p){return a+(p.size||0)},0);var storage="";try{var estimate=await navigator.storage.estimate();if(estimate.quota)storage='<p>Доступно браузерному хранилищу примерно '+Math.round(estimate.quota/1048576)+' МБ (оценка).</p>'}catch(e){}root.innerHTML=header+'<h1>Настройки</h1><p class="subtitle">Картинки сохраняются только на этом устройстве, а не в публичном GitHub.</p><div class="setup"><div class="setting-title">📚 Ваша библиотека</div><p>6 историй по 10 страниц. Загружено '+list.length+' картинок. Занято около '+(total/1048576).toFixed(1)+' МБ.</p>'+storage+'<p>Чтобы добавить изображения, открой книжку и нажми «Добавить картинки».</p></div><div class="setup"><div class="setting-title">☁️ Dropbox</div><p>Оригиналы можно хранить в закрытой папке Dropbox. Автоматическое подключение ещё не настроено: для него необходима безопасная авторизация Dropbox. Секретные ключи в GitHub размещать нельзя.</p></div><div class="setup"><div class="setting-title">✈️ Без интернета</div><p>После первого открытия при наличии сети само приложение сохраняется для офлайн-работы. Добавленные картинки лежат в локальной базе телефона. iOS может очистить данные сайта при нехватке места или удалении приложения, поэтому оригиналы обязательно держи в Dropbox.</p><div class="actions"><button class="btn secondary" data-persist="yes">Попробовать закрепить хранилище</button></div></div>'+navBar();return}}
function renderReader(){var s=stories.find(function(x){return x.id===activeStory});if(!s){screen="home";render();return}var image=photoMap[page]?'<img alt="Иллюстрация к странице '+(page+1)+'" src="'+photoMap[page]+'">':'<div class="reader-emoji" aria-label="Персонаж сказки">'+(s.id==="rabbit"?rabbitArtwork():s.emoji)+'</div>';root.innerHTML='<div class="reader"><header class="reader-head"><button class="round" data-nav="home" aria-label="Закрыть сказку">✕</button><strong>'+s.title+'</strong><button class="round" data-fav="'+s.id+'" aria-label="Добавить в любимые">'+(faves[s.id]?'♥':'♡')+'</button></header><div class="reader-photo" style="--bg:'+s.bg+'" id="photoPanel"><span class="page-tag">Страница '+(page+1)+' из 10</span>'+image+'</div><div class="reader-body"><div class="soft">'+(photoMap[page]?'Наша иллюстрация':'Эскиз · Добавь свою картинку')+'</div><h2>'+s.t[page]+'</h2></div><div class="page-controls"><button data-step="-1" '+(page===0?'disabled':'')+' aria-label="Назад">←</button><span class="dots">'+s.t.map(function(t,i){return '<b class="'+(page===i?'on':'')+'"></b>'}).join("")+'</span><button data-step="1" '+(page===9?'disabled':'')+' aria-label="Вперёд">→</button></div><div class="actions"><button class="btn secondary" data-import="'+s.id+'">＋ Добавить картинки</button><button class="btn secondary" data-clear="'+s.id+'">Очистить картинки</button></div><p class="notice">Выбери до десяти изображений. Они автоматически сжимаются и сохраняются только на этом iPhone. Исходные файлы остаются на месте.</p></div>';var panel=document.getElementById("photoPanel");panel.addEventListener("touchstart",function(e){touchX=e.changedTouches[0].screenX},{passive:true});panel.addEventListener("touchend",function(e){var delta=e.changedTouches[0].screenX-touchX;if(Math.abs(delta)>45)step(delta<0?1:-1)},{passive:true})}
function step(n){page=Math.max(0,Math.min(9,page+n));renderReader()}
async function openStory(id){if(!stories.some(function(s){return s.id===id}))return;activeStory=id;screen="reader";page=0;await hydrate();renderReader();window.scrollTo(0,0)}
async function navigate(next){screen=next;activeStory=null;cleanup();await render();window.scrollTo(0,0)}
function compress(file){return new Promise(function(resolve,reject){var source=URL.createObjectURL(file);var img=new Image();img.onload=function(){try{var max=1350,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));var w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));var c=document.createElement("canvas");c.width=w;c.height=h;var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);c.toBlob(function(blob){URL.revokeObjectURL(source);if(blob)resolve(blob);else reject(new Error("Не удалось сжать изображение"))},"image/webp",.78)}catch(e){URL.revokeObjectURL(source);reject(e)}};img.onerror=function(){URL.revokeObjectURL(source);reject(new Error("Формат изображения не поддерживается"))};img.src=source})}
document.getElementById("fileInput").addEventListener("change",async function(e){var files=Array.from(e.target.files||[]).filter(function(f){return f.type.indexOf("image/")===0}).sort(function(a,b){return a.name.localeCompare(b.name,"ru",{numeric:true})}).slice(0,10);if(!files.length)return;if(!database){message("Локальное хранилище недоступно");return}message("Сохраняем "+files.length+" картинок…");var ok=0;for(var i=0;i<files.length;i++){try{var blob=await compress(files[i]);await saveImage(importStory+":"+i,blob);ok++}catch(err){console.warn("Import failed",files[i].name,err)}}await hydrate();renderReader();message("Добавлено "+ok+" из "+files.length+" изображений");e.target.value=""});
root.addEventListener("click",async function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.book)openStory(b.dataset.book);else if(b.dataset.nav)navigate(b.dataset.nav);else if(b.dataset.step)step(Number(b.dataset.step));else if(b.dataset.fav){var id=b.dataset.fav;faves[id]=!faves[id];saveFaves();renderReader()}else if(b.dataset.import){importStory=b.dataset.import;document.getElementById("fileInput").click()}else if(b.dataset.clear){if(!database)return;if(confirm("Удалить только картинки этой сказки с iPhone? Оригиналы в Dropbox не изменятся.")){await clearBook(b.dataset.clear);await hydrate();renderReader();message("Локальные картинки удалены")}}else if(b.dataset.persist){try{var ok=await navigator.storage.persist();message(ok?"Хранилище закреплено":"iOS не разрешила закрепление. Храни оригиналы в Dropbox.")}catch(err){message("Эта функция не поддерживается")}}});
window.addEventListener("keydown",function(e){if(screen==="reader"&&e.key==="ArrowRight")step(1);if(screen==="reader"&&e.key==="ArrowLeft")step(-1);if(screen==="reader"&&e.key==="Escape")navigate("home")});
async function init(){try{faves=JSON.parse(localStorage.getItem("nikole-storybook-favorites")||"{}")||{}}catch(e){}try{database=await openDb()}catch(e){console.warn(e);message("Нет доступа к хранилищу картинок")}render();if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){navigator.serviceWorker.register("./sw.js").catch(function(err){console.warn(err)})}}
init();
})();
</script>
